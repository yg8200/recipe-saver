services:
  db:
    image: pgvector/pgvector:pg16
    container_name: recipe_saver_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recipe_saver
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # backend waits for this, not just for the container to start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recipe_saver"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    container_name: recipe_saver_backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # "db" is the service name; overrides DATABASE_URL from .env
      DATABASE_URL: postgresql://postgres:postgres@db:5432/recipe_saver
    ports:
      - "5001:5001"
    volumes:
      # Live reload in dev
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: recipe_saver_frontend
    restart: unless-stopped
    ports:
      # Open http://localhost:8080. 80 is nginx's port inside the container.
      - "8080:80"
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: recipe_saver_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - ./servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
  pgadmin_data:
