<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Colors the phone browser's address bar to match the page -->
    <meta name="theme-color" content="#f5ebdd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181311" media="(prefers-color-scheme: dark)" />
    <!-- Rubik supports both Hebrew and Latin, so Hebrew UI and the occasional English recipe share one font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>שומר המתכונים</title>
    <!-- Runs before the page paints: apply the saved (or system) theme so dark mode never flashes white. -->
    <script>
      try {
        var saved = localStorage.getItem('theme')
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
