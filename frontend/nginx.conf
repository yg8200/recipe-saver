server {
  listen 80;
  root /usr/share/nginx/html;

  # Photos can be several MB; nginx's default limit is 1 MB and would reject them with a 413.
  client_max_body_size 20m;

  # Same job as the Vite dev proxy: /api/recipes/5 -> http://backend:5001/recipes/5.
  # The trailing slash on proxy_pass makes nginx strip the /api prefix. "backend" is the
  # compose service name, which Docker's internal DNS resolves to the backend container.
  location /api/ {
    proxy_pass http://backend:5001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # AI extraction can take 10-30s; allow generous time before nginx gives up.
    proxy_read_timeout 120s;
  }

  # React Router handles URLs like /recipes/5 in the browser. If no real file matches,
  # serve index.html and let the app render the right page (otherwise a refresh gives 404).
  location / {
    try_files $uri /index.html;
  }

  # Hashed build assets never change, so browsers can cache them for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
