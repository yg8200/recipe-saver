server {
  listen 80;
  root /usr/share/nginx/html;

  # Default is 1 MB, too small for phone photos
  client_max_body_size 20m;

  # Trailing slash strips the /api prefix: /api/recipes/5 -> backend:5001/recipes/5
  location /api/ {
    proxy_pass http://backend:5001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # AI extraction can take 10-30s
    proxy_read_timeout 120s;
  }

  # SPA fallback. index.html is not cached so a rebuild shows up immediately
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  # File names are content-hashed, so they never change
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
